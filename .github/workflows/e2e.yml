name: E2E

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: bun e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MONOREPO_DIR: ${{ github.workspace }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      VIBEFI_WC_PROJECT_ID: ${{ secrets.VIBEFI_WC_PROJECT_ID }}

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev xvfb xauth ripgrep
          version: 1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client -> target
            gov-agent -> target

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install client WalletConnect helper dependencies
        if: env.OPENAI_API_KEY != ''
        run: bun install --cwd client/walletconnect-helper --frozen-lockfile

      - name: Run E2E tests
        working-directory: e2e
        run: |
          if [ -n "${OPENAI_API_KEY}" ]; then
            xvfb-run -a bun run e2e -- --gov-agent --client --tool-output --verbose
          else
            echo "OPENAI_API_KEY not set; running baseline e2e"
            bun run e2e
          fi

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          path: |
            contracts/.devnet/devnet.json
            contracts/broadcast/script/LocalDevnet.s.sol
